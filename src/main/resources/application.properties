spring.application.name=mend-ops-ai

server.port=8095

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash

management.endpoints.web.exposure.include=health,info

logging.level.com.giri.ai.mendops=INFO
#logging.level.com.giri.ai.mendops=DEBUG

spring.config.import=optional:file:.env[.properties]


mendops.telemetry.circuit-breakers.actuator-base-url=http://localhost:8081
mendops.telemetry.circuit-breakers.names=productClient,customerClient

mendops.telemetry.outbox-sources.oms-main.jdbc-url=jdbc:postgresql://localhost:5432/oms
mendops.telemetry.outbox-sources.oms-main.username=${OMS_DB_READONLY_USER}
mendops.telemetry.outbox-sources.oms-main.password=${OMS_DB_READONLY_PASSWORD}

mendops.telemetry.outbox-sources.product-service.jdbc-url=jdbc:postgresql://localhost:5433/product_service
mendops.telemetry.outbox-sources.product-service.username=${PRODUCT_DB_READONLY_USER}
mendops.telemetry.outbox-sources.product-service.password=${PRODUCT_DB_READONLY_PASSWORD}

mendops.telemetry.outbox-sources.customer-service.jdbc-url=jdbc:postgresql://localhost:5434/customer_service
mendops.telemetry.outbox-sources.customer-service.username=${CUSTOMER_DB_READONLY_USER}
mendops.telemetry.outbox-sources.customer-service.password=${CUSTOMER_DB_READONLY_PASSWORD}

mendops.telemetry.kafka.bootstrap-servers=localhost:29092
mendops.telemetry.kafka.dlq-topics=oms.customer.events.DLT,oms.product.events.DLT

mendops.telemetry.poll-interval-ms=30000

mendops.telemetry.outbox-sources.oms-main.schema=oms_messaging

# replayDlqBatch: bootstrap-servers falls back to mendops.telemetry.kafka.bootstrap-servers
# if left unset here. Uncomment/adjust source-topic-override only for DLQ topics that
# don't follow the "<source-topic>.DLT" naming convention.
mendops.remediation.dlq.consumer-group-id=mend-ops-ai-dlq-replay
#mendops.remediation.dlq.source-topic-override.oms.customer.events.DLT=oms.customer.events

# adjustRetryBudget: oms-main owns the RetryRegistry for both "productClient" and
# "customerClient" (they're resilience4j instance names for oms-main's own outbound
# clients — product-service/customer-service don't implement resilience4j themselves).
# Same host as mendops.telemetry.circuit-breakers.actuator-base-url above.
mendops.remediation.retry-budget.admin-base-url.productClient=http://localhost:8080
mendops.remediation.retry-budget.admin-base-url.customerClient=http://localhost:8080

# pageOncall: Slack-incoming-webhook-style URL (POSTed {"text": "..."}).
# Leave unset to just log pages at WARN instead of sending them.
mendops.remediation.paging.webhook-url=${PAGING_WEBHOOK_URL:}