spring.application.name=mend-ops-ai

server.port=8099

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash

management.endpoints.web.exposure.include=health,info

logging.level.com.giri.ai.mendops=INFO
#logging.level.com.giri.ai.mendops=DEBUG

spring.config.import=optional:file:.env[.properties]


mendops.telemetry.circuit-breakers.actuator-base-url=http://localhost:8081
mendops.telemetry.circuit-breakers.names=productClient,customerClient

mendops.telemetry.outbox-sources.oms-main.jdbc-url=jdbc:postgresql://localhost:5432/oms
mendops.telemetry.outbox-sources.oms-main.username=${OMS_DB_READONLY_USER}
mendops.telemetry.outbox-sources.oms-main.password=${OMS_DB_READONLY_PASSWORD}

mendops.telemetry.outbox-sources.product-service.jdbc-url=jdbc:postgresql://localhost:5433/product_service
mendops.telemetry.outbox-sources.product-service.username=${PRODUCT_DB_READONLY_USER}
mendops.telemetry.outbox-sources.product-service.password=${PRODUCT_DB_READONLY_PASSWORD}

mendops.telemetry.outbox-sources.customer-service.jdbc-url=jdbc:postgresql://localhost:5434/customer_service
mendops.telemetry.outbox-sources.customer-service.username=${CUSTOMER_DB_READONLY_USER}
mendops.telemetry.outbox-sources.customer-service.password=${CUSTOMER_DB_READONLY_PASSWORD}

mendops.telemetry.kafka.bootstrap-servers=localhost:29092
mendops.telemetry.kafka.dlq-topics=oms.customer.events.DLT,oms.product.events.DLT

mendops.telemetry.poll-interval-ms=30000

mendops.telemetry.outbox-sources.oms-main.schema=oms_messaging

# replayDlqBatch: bootstrap-servers falls back to mendops.telemetry.kafka.bootstrap-servers
# if left unset here. Uncomment/adjust source-topic-override only for DLQ topics that
# don't follow the "<source-topic>.DLT" naming convention.
mendops.remediation.dlq.consumer-group-id=mend-ops-ai-dlq-replay
#mendops.remediation.dlq.source-topic-override.oms.customer.events.DLT=oms.customer.events

# adjustRetryBudget: oms-main owns the RetryRegistry for both "productClient" and
# "customerClient" (they're resilience4j instance names for oms-main's own outbound
# clients — product-service/customer-service don't implement resilience4j themselves).
# This is an actuator endpoint (/actuator/retrybudget), so it's on oms-main's
# management port - same host as mendops.telemetry.circuit-breakers.actuator-base-url
# above, NOT the main app port mendops.oms-auth.base-url below points at.
#
# The map KEYS (productClient/customerClient) stay hardcoded here rather than coming
# from env vars - same reasoning as outbox-sources above: Spring's relaxed env-var
# binding lowercases derived property names, so an env var meant to produce the key
# "productClient" would actually bind as "productclient", silently missing the
# exact-case Map.get("productClient") lookup RetryBudgetAdminClient does. Only the
# VALUES are env-driven (via ${...} placeholders, defaulting to localhost for a plain
# local run) so docker-compose can point them at the container network's "app" host
# without touching map keys at all.
mendops.remediation.retry-budget.admin-base-url.productClient=${MENDOPS_RETRYBUDGET_PRODUCTCLIENT_URL:http://localhost:8081}
mendops.remediation.retry-budget.admin-base-url.customerClient=${MENDOPS_RETRYBUDGET_CUSTOMERCLIENT_URL:http://localhost:8081}

# Steady-state maxAttempts for each instance name - what GET /api/v1/agent/retry-budgets/status
# compares the most recently approved value against, to flag a budget that's still widened from
# a past incident and was never put back. Same map-key-stays-hardcoded reasoning as above; these
# ARE the plain defaults (no env override) since they're this app's own record of "normal", not
# environment-specific like a URL.
#
# 3 below is a PLACEHOLDER, not read from oms-main - check oms-main's own
# resilience4j.retry.instances.{productClient,customerClient}.max-attempts (or equivalent) and
# set these to match, or every status check will be comparing against the wrong number.
mendops.remediation.retry-budget.default-max-attempts.productClient=3
mendops.remediation.retry-budget.default-max-attempts.customerClient=3

# mend-ops-ai's own SERVICE-role account on oms-main (see oms-main's ServiceAccountSeeder),
# used by OmsAuthClient to obtain the bearer token RetryBudgetAdminClient sends.
# base-url is oms-main's MAIN app port (login is a normal MVC controller, not actuator
# infra) - deliberately NOT the same host as retry-budget.admin-base-url above.
mendops.oms-auth.base-url=http://localhost:8080
mendops.oms-auth.username=${MENDOPS_OMS_SERVICE_USERNAME}
mendops.oms-auth.password=${MENDOPS_OMS_SERVICE_PASSWORD}

# mend-ops-ai's OWN dedicated database - the approval/audit trail (ApprovalAuditEntity),
# NOT one of the read-only outbox sources above, and NOT shared with oms-main's own
# "postgres" container either. Schema comes from db/init.sql, not Hibernate (see
# spring.jpa.hibernate.ddl-auto below).
#
# For docker-compose: nothing to do - `docker compose up` starts mend-ops-postgres
# (its own Postgres 16 container) alongside the app, database/role/schema are all
# created automatically on first boot (POSTGRES_DB/POSTGRES_USER/POSTGRES_PASSWORD +
# db/init.sql via /docker-entrypoint-initdb.d/).
#
# For running the app locally without Docker (e.g. via an IDE): start just the DB
# container with `docker compose up -d mend-ops-postgres`, which publishes it on host
# port 5436 (see docker-compose.yml) - the default below already points at that, so a
# plain local run needs no other setup.
mendops.persistence.jdbc-url=${MENDOPS_PERSISTENCE_JDBCURL:jdbc:postgresql://localhost:5436/mendops}
mendops.persistence.username=${MENDOPS_DB_USER}
mendops.persistence.password=${MENDOPS_DB_PASSWORD}

# validate (not update/create) - Hibernate checks the schema in db/init.sql matches
# ApprovalAuditEntity at startup and fails fast if they've drifted, rather than silently
# owning/altering the schema itself. A real production service would use a proper
# migration tool (Flyway/Liquibase) to apply db/init.sql-equivalent changes over time;
# validate is the pragmatic middle ground for this project's scope - closer to real
# practice than update, without adding a migration framework dependency.

# open-in-view=false avoids the classic lazy-loading-in-the-view anti-pattern warning;
# nothing here needs a session open past the repository call anyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# pageOncall: Slack-incoming-webhook-style URL (POSTed {"text": "..."}).
# Leave unset to just log pages at WARN instead of sending them.
mendops.remediation.paging.webhook-url=${PAGING_WEBHOOK_URL:}